<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreatorOS — Know What Works</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0c;
  --card: #131313;
  --border: #1f1f1f;
  --border2: #2a2a2a;
  --text: #efefef;
  --muted: #555;
  --muted2: #888;
  --green: #b9ff66;
  --red: #ff6b6b;
  --yellow: #ffd166;
  --blue: #66c2ff;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Geist', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

/* Layout */
.wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

/* Header */
header {
  padding: 48px 0 40px;
  border-bottom: 1px solid var(--border);
}
.tag {
  display: inline-block;
  font-family: 'Geist Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--green);
  background: rgba(185,255,102,0.08);
  border: 1px solid rgba(185,255,102,0.15);
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 20px;
}
h1 {
  font-family: 'Instrument Serif', serif;
  font-size: clamp(38px, 7vw, 56px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  font-weight: 400;
}
h1 em {
  font-style: italic;
  color: var(--green);
}
.sub {
  margin-top: 12px;
  color: var(--muted2);
  font-size: 14px;
  max-width: 400px;
}

/* Upload */
.upload-wrap { padding: 36px 0 0; }

.drop-zone {
  border: 1.5px dashed var(--border2);
  border-radius: 14px;
  padding: 36px 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  background: var(--card);
  position: relative;
}
.drop-zone:hover, .drop-zone.over {
  border-color: var(--green);
  background: rgba(185,255,102,0.03);
}
.drop-icon { font-size: 32px; margin-bottom: 10px; }
.drop-zone h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.drop-zone p { color: var(--muted); font-size: 12px; font-family: 'Geist Mono', monospace; }
#fileInput { display: none; }

/* Previews */
.previews {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.prev-item {
  position: relative;
  width: 64px;
  height: 100px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--border2);
}
.prev-item img { width:100%; height:100%; object-fit:cover; }
.prev-item button {
  position: absolute; top: 3px; right: 3px;
  background: rgba(0,0,0,0.75); border: none; color: #fff;
  width: 18px; height: 18px; border-radius: 50%;
  font-size: 10px; cursor: pointer; display:flex; align-items:center; justify-content:center;
}

/* Analyze btn */
.btn {
  width: 100%;
  margin-top: 16px;
  padding: 16px;
  background: var(--green);
  color: #0c0c0c;
  border: none;
  border-radius: 10px;
  font-family: 'Geist', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  position: relative;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.92; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn.loading { color: transparent; }
.btn.loading::after {
  content:''; position:absolute; width:18px; height:18px;
  border: 2px solid #0c0c0c; border-top-color: transparent;
  border-radius:50%; top:50%; left:50%;
  transform:translate(-50%,-50%);
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

/* Results */
#results { padding: 40px 0 60px; display: none; }
#results.show { display: block; }

/* Summary card — the big one at top */
.summary-card {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 12px;
  animation: up 0.35s ease both;
}
.summary-card .s-label {
  font-family: 'Geist Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted2);
  margin-bottom: 10px;
}
.summary-card .s-text {
  font-family: 'Instrument Serif', serif;
  font-size: 22px;
  line-height: 1.3;
  color: var(--text);
}
.summary-card .s-text strong {
  color: var(--green);
  font-style: italic;
}

/* Next title box */
.next-title-card {
  background: rgba(185,255,102,0.05);
  border: 1px solid rgba(185,255,102,0.2);
  border-radius: 14px;
  padding: 20px 24px;
  margin-bottom: 12px;
  animation: up 0.35s ease 0.1s both;
  display: flex;
  align-items: center;
  gap: 16px;
}
.next-title-card .nt-icon { font-size: 28px; flex-shrink: 0; }
.next-title-card .nt-label {
  font-family: 'Geist Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 4px;
}
.next-title-card .nt-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}

/* Accordion cards */
.accordion {
  border: 1px solid var(--border2);
  border-radius: 12px;
  margin-bottom: 8px;
  overflow: hidden;
  animation: up 0.35s ease both;
}
.acc-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  cursor: pointer;
  background: var(--card);
  transition: background 0.15s;
  user-select: none;
}
.acc-header:hover { background: #161616; }
.acc-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.acc-title { flex: 1; font-size: 14px; font-weight: 600; }
.acc-conf {
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  color: var(--muted2);
}
.acc-arrow {
  font-size: 12px; color: var(--muted); transition: transform 0.2s;
}
.accordion.open .acc-arrow { transform: rotate(180deg); }

.acc-body {
  display: none;
  padding: 0 18px 16px;
  background: var(--card);
  border-top: 1px solid var(--border);
}
.accordion.open .acc-body { display: block; }
.acc-body p {
  font-size: 13px;
  color: var(--muted2);
  line-height: 1.7;
  padding-top: 14px;
}
.acc-body .suggest {
  margin-top: 12px;
  background: rgba(185,255,102,0.05);
  border: 1px solid rgba(185,255,102,0.15);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--green);
}
.acc-body .suggest span {
  display: block;
  font-family: 'Geist Mono', monospace;
  font-size: 10px;
  font-weight: 400;
  color: var(--muted);
  margin-bottom: 3px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

@keyframes up {
  from { opacity:0; transform: translateY(12px); }
  to { opacity:1; transform: translateY(0); }
}

/* Error */
.err {
  background: rgba(255,107,107,0.07);
  border: 1px solid rgba(255,107,107,0.2);
  border-radius: 10px;
  padding: 16px 18px;
  font-size: 13px;
  color: var(--red);
  font-family: 'Geist Mono', monospace;
  line-height: 1.6;
}

footer {
  border-top: 1px solid var(--border);
  padding: 20px 0;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  font-family: 'Geist Mono', monospace;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">CreatorOS v0.1</div>
    <h1>Find out what your<br>audience <em>actually</em> wants.</h1>
    <p class="sub">Upload YouTube Studio screenshots. Get patterns, warnings, and your next title — in seconds.</p>
  </header>

  <div class="upload-wrap">
    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">📸</div>
      <h3>Drop YouTube Studio screenshots here</h3>
      <p>PNG · JPG · multiple files ok</p>
      <input type="file" id="fileInput" accept="image/*" multiple />
    </div>
    <div class="previews" id="previews"></div>
    <button class="btn" id="analyzeBtn" disabled>Analyze my channel →</button>
  </div>

  <div id="results">
    <div id="resultsInner"></div>
  </div>

  <footer>creatorOS · your data never leaves your browser</footer>
</div>

<script>
const WORKER = 'https://content.ab2893935.workers.dev/';
const drop = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const previews = document.getElementById('previews');
const btn = document.getElementById('analyzeBtn');
const results = document.getElementById('results');
const inner = document.getElementById('resultsInner');
let files = [];

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); add(Array.from(e.dataTransfer.files)); });
fileInput.addEventListener('change', e => add(Array.from(e.target.files)));

function add(newFiles) {
  newFiles.filter(f => f.type.startsWith('image/')).forEach(f => {
    files.push(f);
    const r = new FileReader();
    r.onload = e => {
      const idx = files.length - 1;
      const d = document.createElement('div');
      d.className = 'prev-item';
      d.innerHTML = `<img src="${e.target.result}"><button onclick="remove(${idx})">×</button>`;
      previews.appendChild(d);
    };
    r.readAsDataURL(f);
  });
  sync();
}

function remove(i) {
  files.splice(i, 1);
  previews.innerHTML = '';
  const tmp = [...files]; files = [];
  add(tmp);
}

function sync() { btn.disabled = files.length === 0; }

async function toB64(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

btn.addEventListener('click', async () => {
  if (!files.length) return;
  btn.classList.add('loading'); btn.disabled = true;
  results.classList.remove('show'); inner.innerHTML = '';

  try {
    const parts = await Promise.all(files.map(async f => ({
      inlineData: { mimeType: f.type, data: await toB64(f) }
    })));

    const prompt = `You are a sharp YouTube Shorts analyst. A creator uploaded their YouTube Studio screenshots.

Your job: find what's actually working and give them ONE clear action.

Extract all video titles and view counts from the screenshots.

Then respond ONLY with a JSON object (no markdown, no explanation) in this exact shape:

{
  "summary": "One punchy sentence (max 20 words) summarizing the single biggest insight from their data. Be specific with numbers.",
  "next_title": "The single best title they should post next, based on their top pattern.",
  "findings": [
    {
      "type": "pattern",
      "title": "Short name (4 words max)",
      "body": "2-3 sentences max. Specific video names and view counts. Why this pattern works.",
      "confidence": 90,
      "suggested_title": "Optional: a specific title to test"
    },
    {
      "type": "warning",
      "title": "Short name (4 words max)",
      "body": "2-3 sentences max. What's hurting performance and why.",
      "confidence": 80
    }
  ]
}

Rules:
- summary must mention actual numbers from their data
- next_title must be specific and ready to use, not generic
- findings: max 4 items total, mix of patterns and warnings
- body: SHORT. 2-3 sentences only. No fluff.
- Only conclusions the data supports. No generic YouTube advice.`;

    const res = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }, ...parts] }],
        generationConfig: { temperature: 0.2 }
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    render(raw);
  } catch(e) {
    inner.innerHTML = `<div class="err">⚠ ${e.message}</div>`;
    results.classList.add('show');
  }

  btn.classList.remove('loading'); btn.disabled = false;
  results.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

function render(raw) {
  results.classList.add('show');
  try {
    const clean = raw.replace(/```json|```/g, '').trim();
    const d = JSON.parse(clean);
    let html = '';

    // Summary
    if (d.summary) {
      const bold = d.summary.replace(/(\d[\d,.KkMm]*x?)/g, '<strong>$1</strong>');
      html += `<div class="summary-card">
        <div class="s-label">📊 Channel Insight</div>
        <div class="s-text">${bold}</div>
      </div>`;
    }

    // Next title
    if (d.next_title) {
      html += `<div class="next-title-card">
        <div class="nt-icon">🎯</div>
        <div>
          <div class="nt-label">Post This Next</div>
          <div class="nt-title">${d.next_title}</div>
        </div>
      </div>`;
    }

    // Findings as accordion
    if (d.findings?.length) {
      d.findings.forEach((f, i) => {
        const color = f.type === 'warning' ? 'var(--red)' : f.type === 'pattern' ? 'var(--green)' : 'var(--yellow)';
        const icon = f.type === 'warning' ? '⚠' : f.type === 'pattern' ? '🔍' : '💡';
        const conf = f.confidence ? `${f.confidence}%` : '';
        html += `<div class="accordion" style="animation-delay:${0.15 + i*0.07}s">
          <div class="acc-header" onclick="toggle(this)">
            <div class="acc-dot" style="background:${color}"></div>
            <div class="acc-title">${icon} ${f.title}</div>
            ${conf ? `<div class="acc-conf">${conf}</div>` : ''}
            <div class="acc-arrow">▼</div>
          </div>
          <div class="acc-body">
            <p>${f.body}</p>
            ${f.suggested_title ? `<div class="suggest"><span>Try this title</span>${f.suggested_title}</div>` : ''}
          </div>
        </div>`;
      });
    }

    inner.innerHTML = html;
  } catch {
    inner.innerHTML = `<div class="err" style="white-space:pre-wrap;font-size:12px">${raw}</div>`;
  }
}

function toggle(header) {
  const acc = header.closest('.accordion');
  acc.classList.toggle('open');
}
</script>
</body>
</html>
