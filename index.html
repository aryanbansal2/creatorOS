
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Sans:wght@400;500&display=swap');

  .co-wrap {
    font-family: 'DM Sans', sans-serif;
    padding: 1.5rem 0;
    color: var(--color-text-primary);
  }

  .co-logo {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    margin-bottom: 2rem;
  }

  .co-logo span {
    color: var(--color-text-primary);
  }

  .co-upload-zone {
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg);
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s;
    background: var(--color-background-primary);
    position: relative;
  }

  .co-upload-zone:hover {
    background: var(--color-background-secondary);
  }

  .co-upload-zone.drag-over {
    border-color: var(--color-border-primary);
    background: var(--color-background-secondary);
  }

  .co-upload-icon {
    font-size: 32px;
    color: var(--color-text-tertiary);
    margin-bottom: 0.75rem;
  }

  .co-upload-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 0.35rem;
  }

  .co-upload-sub {
    font-size: 13px;
    color: var(--color-text-secondary);
    line-height: 1.5;
  }

  .co-upload-hint {
    display: inline-block;
    margin-top: 1rem;
    font-size: 11px;
    color: var(--color-text-tertiary);
    background: var(--color-background-secondary);
    border-radius: 4px;
    padding: 3px 8px;
    letter-spacing: 0.04em;
  }

  .co-previews {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 1rem;
  }

  .co-preview-thumb {
    width: 64px;
    height: 64px;
    border-radius: 6px;
    object-fit: cover;
    border: 0.5px solid var(--color-border-tertiary);
    position: relative;
  }

  .co-preview-wrap {
    position: relative;
    display: inline-block;
  }

  .co-preview-remove {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-secondary);
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-secondary);
  }

  .co-btn {
    width: 100%;
    margin-top: 1.25rem;
    padding: 12px;
    background: var(--color-text-primary);
    color: var(--color-background-primary);
    border: none;
    border-radius: var(--border-radius-md);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .co-btn:hover { opacity: 0.85; }
  .co-btn:disabled { opacity: 0.4; cursor: default; }

  .co-btn-secondary {
    background: transparent;
    color: var(--color-text-secondary);
    border: 0.5px solid var(--color-border-secondary);
    margin-top: 0.75rem;
    font-size: 13px;
    padding: 10px;
  }

  .co-loading {
    text-align: center;
    padding: 2rem 0;
    display: none;
  }

  .co-loading-bar {
    height: 2px;
    background: var(--color-border-tertiary);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 1rem;
  }

  .co-loading-fill {
    height: 100%;
    width: 0%;
    background: var(--color-text-primary);
    border-radius: 2px;
    animation: fill-bar 8s ease-in-out forwards;
  }

  @keyframes fill-bar {
    0% { width: 0% }
    60% { width: 80% }
    90% { width: 92% }
    100% { width: 95% }
  }

  .co-loading-label {
    font-size: 13px;
    color: var(--color-text-secondary);
  }

  .co-results {
    display: none;
  }

  .co-insight-card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg);
    padding: 1.25rem;
    margin-bottom: 0.75rem;
  }

  .co-insight-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    margin-bottom: 0.5rem;
  }

  .co-insight-text {
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.4;
  }

  .co-next-card {
    background: var(--color-text-primary);
    color: var(--color-background-primary);
    border-radius: var(--border-radius-lg);
    padding: 1.25rem;
    margin-bottom: 0.75rem;
  }

  .co-next-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 0.5rem;
  }

  .co-next-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 0.75rem;
  }

  .co-copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    background: rgba(255,255,255,0.12);
    border: 0.5px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    color: inherit;
    padding: 5px 10px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }

  .co-copy-btn:hover { background: rgba(255,255,255,0.2); }

  .co-findings {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }

  .co-finding {
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
    overflow: hidden;
    background: var(--color-background-primary);
  }

  .co-finding-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    user-select: none;
  }

  .co-finding-header:hover {
    background: var(--color-background-secondary);
  }

  .co-finding-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  .badge-pattern {
    background: #E6F1FB;
    color: #0C447C;
  }

  .badge-warning {
    background: #FAEEDA;
    color: #633806;
  }

  @media (prefers-color-scheme: dark) {
    .badge-pattern { background: #0C447C; color: #B5D4F4; }
    .badge-warning { background: #633806; color: #FAC775; }
  }

  .co-finding-title {
    font-size: 13px;
    font-weight: 500;
    flex: 1;
  }

  .co-finding-conf {
    font-size: 12px;
    color: var(--color-text-tertiary);
    flex-shrink: 0;
  }

  .co-finding-chevron {
    font-size: 14px;
    color: var(--color-text-tertiary);
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .co-finding.open .co-finding-chevron {
    transform: rotate(180deg);
  }

  .co-finding-body {
    display: none;
    padding: 0 12px 12px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--color-text-secondary);
    border-top: 0.5px solid var(--color-border-tertiary);
  }

  .co-finding.open .co-finding-body {
    display: block;
  }

  .co-finding-body-inner {
    padding-top: 10px;
  }

  .co-suggested {
    margin-top: 8px;
    font-size: 12px;
    color: var(--color-text-tertiary);
  }

  .co-suggested strong {
    color: var(--color-text-primary);
    font-weight: 500;
  }

  .co-second-opinion {
    margin-top: 0.5rem;
  }

  .co-footer {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 0.5px solid var(--color-border-tertiary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--color-text-tertiary);
  }

  .co-model-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .co-error {
    font-size: 13px;
    color: var(--color-text-danger);
    padding: 12px;
    border: 0.5px solid var(--color-border-danger);
    border-radius: var(--border-radius-md);
    margin-top: 0.75rem;
    display: none;
  }
</style>

<div class="co-wrap">
  <div class="co-logo"><span>Creator</span>OS</div>

  <div id="upload-section">
    <div class="co-upload-zone" id="drop-zone">
      <input type="file" id="file-input" multiple accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
      <div class="co-upload-icon"><i class="ti ti-screenshot" aria-hidden="true"></i></div>
      <div class="co-upload-title">Drop your YouTube Studio screenshots</div>
      <div class="co-upload-sub">Content page · Video list · Analytics view<br>No login needed. Screenshots only.</div>
      <div class="co-upload-hint">PNG · JPG · up to 10 images</div>
      <div class="co-previews" id="preview-container"></div>
    </div>

    <div id="worker-url-section" style="margin-top:0.75rem;">
      <input type="text" id="worker-url" placeholder="Your Cloudflare Worker URL  (e.g. https://content.abc.workers.dev)" style="width:100%;font-size:13px;padding:10px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);box-sizing:border-box;">
    </div>

    <button class="co-btn" id="analyze-btn" disabled>Analyze my channel</button>
    <div class="co-error" id="error-box"></div>
  </div>

  <div class="co-loading" id="loading-section">
    <div class="co-loading-bar"><div class="co-loading-fill"></div></div>
    <div class="co-loading-label" id="loading-label">Reading your screenshots...</div>
  </div>

  <div class="co-results" id="results-section">
    <div class="co-insight-card">
      <div class="co-insight-label">Biggest insight</div>
      <div class="co-insight-text" id="result-summary">—</div>
    </div>

    <div class="co-next-card">
      <div class="co-next-label">Post this next</div>
      <div class="co-next-title" id="result-next-title">—</div>
      <button class="co-copy-btn" id="copy-btn">
        <i class="ti ti-copy" style="font-size:13px;" aria-hidden="true"></i> Copy title
      </button>
    </div>

    <div class="co-findings" id="findings-container"></div>

    <div class="co-second-opinion">
      <button class="co-btn co-btn-secondary" id="second-opinion-btn">
        <i class="ti ti-brain" style="font-size:14px;vertical-align:-2px;margin-right:5px;" aria-hidden="true"></i>
        Get second opinion with Gemini
      </button>
    </div>

    <div class="co-footer">
      <span class="co-model-tag">
        <i class="ti ti-cpu" style="font-size:12px;" aria-hidden="true"></i>
        <span id="model-label">Llama 3.2 90B Vision · NVIDIA NIM</span>
      </span>
      <button onclick="resetApp()" style="background:none;border:none;font-size:11px;color:var(--color-text-tertiary);cursor:pointer;padding:0;">
        Analyze another channel →
      </button>
    </div>
  </div>
</div>

<script>
  const fileInput = document.getElementById('file-input');
  const dropZone = document.getElementById('drop-zone');
  const previewContainer = document.getElementById('preview-container');
  const analyzeBtn = document.getElementById('analyze-btn');
  const workerUrlInput = document.getElementById('worker-url');
  const errorBox = document.getElementById('error-box');

  let uploadedFiles = [];

  const loadingMessages = [
    'Reading your screenshots...',
    'Extracting titles and views...',
    'Finding patterns in your data...',
    'Building your report...'
  ];

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  function hideError() {
    errorBox.style.display = 'none';
  }

  function updateAnalyzeBtn() {
    analyzeBtn.disabled = uploadedFiles.length === 0 || !workerUrlInput.value.trim();
  }

  workerUrlInput.addEventListener('input', updateAnalyzeBtn);

  function addFiles(files) {
    for (const f of files) {
      if (!f.type.startsWith('image/')) continue;
      if (uploadedFiles.length >= 10) break;
      uploadedFiles.push(f);
      const wrap = document.createElement('div');
      wrap.className = 'co-preview-wrap';
      const img = document.createElement('img');
      img.className = 'co-preview-thumb';
      img.src = URL.createObjectURL(f);
      const rm = document.createElement('button');
      rm.className = 'co-preview-remove';
      rm.innerHTML = '<i class="ti ti-x" style="font-size:9px;"></i>';
      const idx = uploadedFiles.length - 1;
      rm.onclick = (e) => {
        e.stopPropagation();
        uploadedFiles.splice(idx, 1);
        wrap.remove();
        updateAnalyzeBtn();
      };
      wrap.appendChild(img);
      wrap.appendChild(rm);
      previewContainer.appendChild(wrap);
    }
    updateAnalyzeBtn();
  }

  fileInput.addEventListener('change', () => addFiles(fileInput.files));

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles(e.dataTransfer.files);
  });

  function fileToBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res({ data: r.result.split(',')[1], mimeType: file.type });
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  async function runAnalysis(model) {
    hideError();
    document.getElementById('upload-section').style.display = 'none';
    const loadingEl = document.getElementById('loading-section');
    loadingEl.style.display = 'block';
    document.getElementById('results-section').style.display = 'none';

    let labelIdx = 0;
    const labelInterval = setInterval(() => {
      labelIdx = (labelIdx + 1) % loadingMessages.length;
      document.getElementById('loading-label').textContent = loadingMessages[labelIdx];
    }, 2200);

    try {
      const images = await Promise.all(uploadedFiles.map(fileToBase64));
      const workerUrl = workerUrlInput.value.trim();

      const resp = await fetch(workerUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ images, model: model || 'nvidia' })
      });

      const data = await resp.json();
      clearInterval(labelInterval);

      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

      let content = data.content || '';

      let parsed;
      try {
        const cleaned = content.replace(/```json|```/g, '').trim();
        parsed = JSON.parse(cleaned);
      } catch {
        const match = content.match(/\{[\s\S]*\}/);
        if (match) parsed = JSON.parse(match[0]);
        else throw new Error('Could not parse AI response. Try again.');
      }

      renderResults(parsed, data.modelUsed || model || 'nvidia');

    } catch (err) {
      clearInterval(labelInterval);
      loadingEl.style.display = 'none';
      document.getElementById('upload-section').style.display = 'block';
      showError('Analysis failed: ' + (err.message || 'Unknown error. Check your Worker URL and API keys.'));
    }
  }

  function renderResults(data, modelUsed) {
    document.getElementById('loading-section').style.display = 'none';
    const resultsEl = document.getElementById('results-section');
    resultsEl.style.display = 'block';

    document.getElementById('result-summary').textContent = data.summary || '—';
    document.getElementById('result-next-title').textContent = data.next_title || '—';

    document.getElementById('model-label').textContent =
      modelUsed === 'gemini' ? 'Gemini 2.5 Flash · Google' : 'Llama 3.2 90B Vision · NVIDIA NIM';

    document.getElementById('copy-btn').onclick = () => {
      navigator.clipboard.writeText(data.next_title || '');
      document.getElementById('copy-btn').innerHTML = '<i class="ti ti-check" style="font-size:13px;"></i> Copied';
      setTimeout(() => {
        document.getElementById('copy-btn').innerHTML = '<i class="ti ti-copy" style="font-size:13px;"></i> Copy title';
      }, 1800);
    };

    const container = document.getElementById('findings-container');
    container.innerHTML = '';

    (data.findings || []).forEach((f) => {
      const div = document.createElement('div');
      div.className = 'co-finding';

      const header = document.createElement('div');
      header.className = 'co-finding-header';
      header.innerHTML = `
        <span class="co-finding-badge ${f.type === 'warning' ? 'badge-warning' : 'badge-pattern'}">
          ${f.type === 'warning' ? 'Warning' : 'Pattern'}
        </span>
        <span class="co-finding-title">${f.title || ''}</span>
        <span class="co-finding-conf">${f.confidence ? f.confidence + '%' : ''}</span>
        <i class="ti ti-chevron-down co-finding-chevron" aria-hidden="true"></i>
      `;

      const body = document.createElement('div');
      body.className = 'co-finding-body';
      body.innerHTML = `
        <div class="co-finding-body-inner">
          ${f.body || ''}
          ${f.suggested_title ? `<div class="co-suggested">Try: <strong>${f.suggested_title}</strong></div>` : ''}
        </div>
      `;

      header.onclick = () => div.classList.toggle('open');
      div.appendChild(header);
      div.appendChild(body);
      container.appendChild(div);
    });

    document.getElementById('second-opinion-btn').onclick = () => {
      document.getElementById('second-opinion-btn').disabled = true;
      document.getElementById('second-opinion-btn').textContent = 'Getting second opinion...';
      runAnalysis('gemini');
    };
  }

  analyzeBtn.onclick = () => runAnalysis('nvidia');

  function resetApp() {
    uploadedFiles = [];
    previewContainer.innerHTML = '';
    document.getElementById('results-section').style.display = 'none';
    document.getElementById('upload-section').style.display = 'block';
    document.getElementById('loading-section').style.display = 'none';
    hideError();
    updateAnalyzeBtn();
  }
</script>
